[package]
name = "qookix-launcher"
version = "0.22.1"
description = "QookiX Launcher - a modern, clean and ad-free Minecraft launcher"
authors = ["QookiX"]
edition = "2021"
# 与仓库根目录 LICENSE 保持一致（GNU GPL v3）。
# 注意：vendored 的 cubiomes（MIT，见 vendor/cubiomes/LICENSE）在此以 GPL-3.0 再分发，
# MIT 允许如此；其版权与许可声明见 THIRD_PARTY_NOTICES.md。
license = "GPL-3.0-only"
repository = "https://github.com/weimosheng/QookiX-Launcher"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qookix_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
# devtools：让「程序化打开 DevTools」在 release 构建也可用。
# 用户侧的 F12 / 右键「检查」由 tauri.conf.json 的 devtools:false 关掉，
# 只有开发者页的开关放行时才会走 commands::open_devtools。
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-process = "2.4"
tauri-plugin-updater = "2.14"
tauri-plugin-deep-link = "2.6"
# 好友申请 / 房间邀请的系统通知（窗口最小化时也能收到）
tauri-plugin-notification = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "sync", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "gzip", "brotli", "socks", "system-proxy"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
bytes = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v3", "v4"] }
sha1 = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
fastnbt = "2"
flate2 = "1"
tar = "0.4"
directories = "5"
percent-encoding = "2"
regex = "1"
base64 = "0.22"
sysinfo = "0.30"
junction = "1"
url = "2"
# 日志/文本解码：老版本 MC（1.8.x 等）在中文 Windows 上按系统 ANSI 代码页（GBK）
# 写 latest.log，直接当 UTF-8 读会整片乱码（详见 util::decode_text）
encoding_rs = "0.8"
tauri-plugin-single-instance = "2.4.4"
# PNG 编解码：跨平台使用（投影预览解析贴图、Windows 下图标提取），不能放在平台段
png = "0.17"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
ring = "0.17"

[dev-dependencies]
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }


[profile.release]
strip = true
panic = "abort"
lto = "thin"
# codegen-units=16：CI release 编译提速明显（=1 时 Windows 打包要 13 分钟）。
# 启动器对毫秒级运行性能不敏感，thin LTO 仍保留。
codegen-units = 16
incremental = false
