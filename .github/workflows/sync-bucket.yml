name: Sync update bucket

# 手动把已发布的 Release 产物重新同步到对象存储桶。
# 通常在 push-bucket 因端点限流（SlowDownWrite）失败后使用。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 Release 标签（例如 v0.15.0）"
        required: true
        type: string
      manifest_base:
        description: "可选：清单里的下载地址前缀。留空则指向对象存储；填 GitHub Release 地址可在桶无法上传大文件时兜底"
        required: false
        default: ""
        type: string
      only_manifest:
        description: "仅上传 latest.json（安装包不重新上传）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qookix-bucket-sync-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TAG: ${{ inputs.tag }}
      QOOKIX_BUCKET_UPDATE_URL: ${{ secrets.QOOKIX_BUCKET_UPDATE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.QOOKIX_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.QOOKIX_S3_SECRET_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.QOOKIX_S3_ENDPOINT }}
      QOOKIX_S3_BUCKET: ${{ secrets.QOOKIX_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release assets
        run: |
          mkdir -p release
          gh release download "${GITHUB_TAG}" --dir release --clobber

      - name: Generate update manifests
        run: |
          if [ -n "${{ inputs.manifest_base }}" ]; then
            node scripts/create-bucket-manifest.mjs release "${GITHUB_TAG}" release/latest.json "${{ inputs.manifest_base }}"
          else
            node scripts/create-bucket-manifest.mjs release "${GITHUB_TAG}" bucket-latest.json
            cp bucket-latest.json release/latest.json
          fi
          if [ "${{ inputs.only_manifest }}" != "true" ]; then
            node scripts/fetch-release-json.mjs release/release.json
          fi

      - name: Push update artifacts to object storage bucket
        if: env.QOOKIX_BUCKET_UPDATE_URL != ''
        run: |
          if [ "${{ inputs.only_manifest }}" = "true" ]; then
            aws configure set default.s3.max_concurrent_requests 1
            endpoint_args=()
            if [ -n "${AWS_ENDPOINT_URL:-}" ]; then
              endpoint_args=(--endpoint-url "${AWS_ENDPOINT_URL}")
            fi
            aws "${endpoint_args[@]}" s3 cp release/latest.json \
              "s3://${QOOKIX_S3_BUCKET}/latest.json" \
              --no-progress --checksum-algorithm CRC32
          else
            bash scripts/push-bucket.sh release
          fi
