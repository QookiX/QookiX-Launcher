name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      network_smoke:
        description: "Run live Minecraft service smoke tests"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qookix-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # 主应用与 installer-ui 共用一个 target 目录，避免 GUI 依赖编译两遍
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target-shared
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  NODE_VERSION: "24"

jobs:
  # 质量关：tests + clippy 只在 Linux 跑一次，与三个平台的构建并行
  check:
    name: Tests & Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target-shared

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-webkit-ubuntu2204-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-webkit-ubuntu2204-

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev libdbus-1-dev

      # java_detection_report 测试需要 JVM
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Rust tests
        run: >-
          cargo test --locked --manifest-path src-tauri/Cargo.toml --
          --skip download::diag
          --skip smoke::fabric_meta_parses
          --skip smoke::fabric_patch
          --skip smoke::modrinth_search_with_facets_works
          --skip smoke::mojang_manifest_and_version_json_parse

      - name: Run live Minecraft service smoke tests
        if: github.event_name == 'workflow_dispatch' && inputs.network_smoke
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml smoke::
          cargo test --locked --manifest-path src-tauri/Cargo.toml download::diag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Frontend and release checks
        run: |
          npm ci
          npm test
          npm run build

      - name: Validate source versions against the release tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node scripts/update-version.mjs --check "$GITHUB_REF_NAME"
          else
            node scripts/update-version.mjs --check
          fi

      # 只告警不阻断，为日后 -D warnings 做准备
      - name: Clippy (advisory)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux
          - platform: windows-latest
            artifact: windows
          - platform: macos-latest
            artifact: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install both macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # sccache 不限定 git ref，跨版本标签也能复用依赖编译产物
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # 只缓存 cargo registry/git checkout，避免重复下载 880 个 crate
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target-shared

      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-webkit-ubuntu2204-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-webkit-ubuntu2204-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev libdbus-1-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "NSIS already present: $((Get-Command makensis).Source)"
          } else {
            choco install nsis -y --no-progress
          }

      - name: Install frontend dependencies
        run: npm ci

      # `if` cannot read a secret or a step-level env, so resolve availability
      # into a step output first. Otherwise the decode step was always skipped
      # even when the certificate secret was configured.
      - name: Check code signing certificate
        id: signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          CERT_B64: ${{ secrets.QOOKIX_CERT_PFX_B64 }}
        run: |
          if [ -n "$CERT_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No QOOKIX_CERT_PFX_B64 secret configured - Windows artifacts will be UNSIGNED (antivirus / SmartScreen false positives are likely)"
          fi

      - name: Decode code signing certificate
        if: runner.os == 'Windows' && steps.signing.outputs.available == 'true'
        shell: bash
        env:
          QOOKIX_CERT_PFX_B64: ${{ secrets.QOOKIX_CERT_PFX_B64 }}
        run: |
          echo "$QOOKIX_CERT_PFX_B64" | base64 -d > "$RUNNER_TEMP/qookix.pfx"
          test -s "$RUNNER_TEMP/qookix.pfx"

      - name: Build Tauri app
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # 拾木空间（投影库）OAuth 凭证：编译期注入，正式包里不留用户可填入口
          SHIMU_OAUTH_BROKER_PATH: ${{ vars.SHIMU_OAUTH_BROKER_PATH }}
          # LittleSkin OAuth2（Yggdrasil Connect）凭证：编译期注入，回调地址 qookix://oauth/littleskin/callback
          LITTLESKIN_DEVICE_CLIENT_ID: ${{ vars.LITTLESKIN_DEVICE_CLIENT_ID }}
          # Only point at a pfx when one was actually decoded; an unconditional
          # path made run-tauri.mjs think signing was enabled while the file
          # was missing, so sign-windows.ps1 silently produced unsigned builds.
          QOOKIX_CERT_PFX: ${{ runner.os == 'Windows' && steps.signing.outputs.available == 'true' && format('{0}/qookix.pfx', runner.temp) || '' }}
          QOOKIX_CERT_PASSWORD: ${{ secrets.QOOKIX_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 编译期注入存储桶更新源 URL（Rust 端 option_env! 读取）
          QOOKIX_BUCKET_UPDATE_URL: ${{ secrets.QOOKIX_BUCKET_UPDATE_URL }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run tauri build -- --target universal-apple-darwin
          else
            npm run tauri build
          fi

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Create portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR "release/qookix-launcher.exe"
          if (-not (Test-Path $exe)) { throw "Binary not found: $exe" }
          $ver = node scripts/update-version.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "QookiX Launcher") | Out-Null
          Copy-Item $exe (Join-Path $stage "QookiX Launcher\") -Force
          New-Item -ItemType File -Force -Path (Join-Path $stage "QookiX Launcher/portable.txt") | Out-Null
          $outDir = Join-Path $env:CARGO_TARGET_DIR "release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zip = Join-Path $outDir "QookiX_${ver}_x64_portable.zip"
          Compress-Archive -Path (Join-Path $stage "QookiX Launcher") -DestinationPath $zip -Force
          Write-Host "Created $zip"

      # 只收真正的发布产物；bundle/** 里混有 AppImage/AppDir 的暂存文件不能发布
      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          bundle="$CARGO_TARGET_DIR/release/bundle"
          if [ "$RUNNER_OS" = "macOS" ]; then
            bundle="$CARGO_TARGET_DIR/universal-apple-darwin/release/bundle"
          fi
          find "$bundle" -maxdepth 5 -type f \( \
            -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
            -o -name '*.app.tar.gz' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' \
            -o -name '*.exe' -o -name '*.zip' -o -name '*.sig' \) \
            -exec cp -n {} dist-artifacts/ \;
          if [ "$RUNNER_OS" = "macOS" ]; then
            for archive in dist-artifacts/*.app.tar.gz; do
              test -f "$archive"
              universal="${archive%.app.tar.gz}_universal.app.tar.gz"
              mv -- "$archive" "$universal"
              if [ -f "$archive.sig" ]; then
                mv -- "$archive.sig" "$universal.sig"
              fi
            done
          fi
          echo "--- collected artifacts ---"
          ls -la dist-artifacts

      # 兜底：产物缺失在这里失败，而不是发出残缺的 release
      - name: Verify artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          version=$(node scripts/update-version.mjs --check)
          node scripts/verify-artifacts.mjs dist-artifacts ${{ matrix.artifact }} "$version"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QookiX-${{ matrix.artifact }}
          path: dist-artifacts

  # 汇总三个平台产物，生成 latest.json 并发布 GitHub Release
  verify-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify release tag and prevent overwriting a public release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TAG: ${{ github.ref_name }}
        run: |
          node scripts/update-version.mjs --check "$GITHUB_TAG"
          node scripts/fix-update-manifest.mjs --assert-unpublished

      - name: Generate release notes
        run: node scripts/generate-release-notes.mjs release "$GITHUB_REF_NAME" body.md CHANGELOG.md

      - name: Generate structured changelog JSON
        run: node scripts/generate-changelog-json.mjs CHANGELOG.md release/changelog.json 5

      - name: Upload installers and signatures to a draft
        id: upload_draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QookiX Launcher ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: release/**/*
          body_path: body.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Check download links against uploaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          QOOKIX_RELEASE_ID: ${{ steps.upload_draft.outputs.id }}
        run: node scripts/fix-release-body.mjs "$GITHUB_REF_NAME" --require-links

      - name: Verify uploaded bytes, publish checksums and update manifest, then release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TAG: ${{ github.ref_name }}
          QOOKIX_RELEASE_ID: ${{ steps.upload_draft.outputs.id }}
          QOOKIX_MIN_VERSION: ${{ vars.QOOKIX_MIN_VERSION || secrets.QOOKIX_MIN_VERSION }}
        run: node scripts/fix-update-manifest.mjs --publish-draft release

  # 对象存储同步已迁移到服务器（root@154.36.184.233），
  # 由 /opt/qookix-sync/sync.sh + crontab 每 10 分钟轮询 GitHub Release API
  # 自动下载产物并推送到 rains3 桶。详见 README「发布流程」一节。
